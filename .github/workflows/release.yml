name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: '0.9.1'
          CARGO_ABOUT_SHA256: c0e7dc6f5d74b0beec5c0053d39ab24514c717d19acd91886907a22457ea9e98
        run: |
          archive="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${archive}"
          echo "${CARGO_ABOUT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          echo "$PWD/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Verify third-party notices
        run: |
          scripts/update-third-party-notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Build release binary
        run: cargo build --release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: minisqlite.spdx.json
          artifact-name: minisqlite-${{ github.ref_name }}.spdx.json
          syft-version: v1.50.0
          upload-release-assets: false
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/minisqlite
            THIRD_PARTY_NOTICES.md
            minisqlite.spdx.json
          generate_release_notes: true
